# Single-host production stack: PocketBase (data + files), Fastify API
# (audits, Chromium, PDFs) and the Next.js web app.
#
#   cp .env.example .env      # then fill the keys
#   docker compose up -d --build
#
# Internal service names are used for container-to-container calls; the URLs a
# browser loads must be set to the public host in .env (NEXT_PUBLIC_API_BASE_URL,
# POCKETBASE_PUBLIC_URL, CORS_ORIGINS).

name: rostify

services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Container-internal addresses; the browser never uses these.
      POCKETBASE_URL: http://pocketbase:8090
      WEB_BASE_URL: http://web:3000
      # Behind compose's port mapping every request arrives via the proxy hop.
      TRUST_PROXY: "true"
      # Never allow private-network targets in production (SSRF).
      ALLOW_PRIVATE_HOSTS: "false"
    ports:
      - "4000:4000"
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the client bundle at build time — public API URL.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pb_data:
