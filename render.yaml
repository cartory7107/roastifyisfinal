# Render Blueprint — serverless Rostify API (free plan, no card).
#
# Neon provides Postgres; this service only runs the Fastify API.
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Full walkthrough (Bangla): deploy/serverless/README.md
services:
  - type: web
    name: rostify-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # pnpm is pinned in package.json (`packageManager`), so npx gives the exact
    # version without relying on a globally installed pnpm.
    buildCommand: npx --yes pnpm@9.15.9 install --frozen-lockfile && npx --yes pnpm@9.15.9 --filter backend build
    # Serverless mode needs no Chromium: crawl = fetch + cheerio,
    # performance = PageSpeed Insights, PDF = PDFKit.
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: TRUST_PROXY
        value: "true"
      # 512 MB / 0.1 CPU: one audit at a time keeps memory flat.
      - key: MAX_CONCURRENT_AUDITS
        value: "1"
      # PageSpeed + LLM calls can be slow on 0.1 CPU; give one audit 10 minutes.
      - key: AUDIT_TIMEOUT_MS
        value: "600000"
      # Browser origins allowed to call the API (comma separated).
      - key: CORS_ORIGINS
        value: https://roastifyrs.vercel.app,https://*.vercel.app,https://app.cartory.top
      # --- required: paste the Neon connection string -----------------------
      - key: DATABASE_URL
        sync: false
      # --- optional: raises the keyless PageSpeed quota ---------------------
      - key: PSI_API_KEY
        sync: false
      # --- optional analysis keys (the pipeline degrades without them) ------
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SEODATA_API_KEY
        sync: false
      - key: OPENPAGERANK_API_KEY
        sync: false
