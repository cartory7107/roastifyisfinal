# Reverse proxy for the single-container deploy.
#
# Everything lives on one origin, so the browser never needs CORS: the web app
# is served from `/`, the API from `/svc/`, and PocketBase (files + admin UI)
# from `/api/` and `/_/`.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 75s;
  client_max_body_size 25m;

  # Writable temp paths for the unprivileged user.
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 7860;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;

    # Audit API: /svc/audit -> /audit
    location /svc/ {
      proxy_pass http://127.0.0.1:4000/;
    }

    # PocketBase REST + file links (screenshots, PDFs).
    location /api/ {
      proxy_pass http://127.0.0.1:8090;
    }

    # PocketBase admin UI.
    location /_/ {
      proxy_pass http://127.0.0.1:8090;
    }

    # Next.js web app (including /_next assets and the /print report page).
    location / {
      proxy_pass http://127.0.0.1:3000;
    }
  }
}
